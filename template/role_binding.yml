---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: <service_account_name>-binding
  namespace: <namespace>
subjects:
  - kind: ServiceAccount
    name: <service_account_name>
    namespace: <namespace>
roleRef:
  kind: Role
  name: <role_name>
  apiGroup: rbac.authorization.k8s.io